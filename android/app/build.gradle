plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'io.github.innomaster01del.portalrps'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.innomaster01del.portalrps'   // permanent once published
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "3.0.${buildNumber}"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }   // real phones only (drops emulator libraries)
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }

    // MediaPipe memory-maps the model, so it must stay uncompressed inside the APK
    androidResources {
        noCompress 'task'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.ar:core:1.43.0'
    implementation 'com.google.mediapipe:tasks-vision:0.10.21'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    // align old kotlin-stdlib-jdk7/jdk8 pulled in by dependencies with kotlin-stdlib (avoids duplicate classes)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
