name: Build APK and publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Publish web app (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Build signed APK
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_PATH: /tmp/portal-release.jks
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key-123' }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'portal' }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key-123' }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signing key
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KEYSTORE_PATH"
            echo "Using the permanent key from repository secrets."
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Portal RPS, O=Portal RPS, C=IL"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a temporary key. To update the installed app you will have to uninstall it first. See README."
          fi

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK and key fingerprint
        id: out
        run: |
          NAME="PortalRPS-v1.0.${VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          SHA=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          cat > assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "io.github.innomaster01del.portalrps",
              "sha256_cert_fingerprints": ["$SHA"]
            }
          }]
          EOF
          {
            echo "## APK: $NAME"
            echo "Signing key SHA-256: \`$SHA\`"
            echo
            echo "assetlinks.json (for https://innomaster01-del.github.io/.well-known/assetlinks.json):"
            echo '```json'; cat assetlinks.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            ${{ steps.out.outputs.apk }}
            assetlinks.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: פורטל אבן נייר v1.0.${{ github.run_number }}
          body: |
            להתקנה: הורידו את קובץ ה-APK בטלפון אנדרואיד ופתחו אותו.
            צריך Google Chrome מעודכן ומכשיר שתומך ב-ARCore.
          files: ${{ steps.out.outputs.apk }}
          make_latest: true
