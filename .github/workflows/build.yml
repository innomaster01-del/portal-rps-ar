name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build signed APK
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_PATH: /tmp/portal-release.jks
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key-123' }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'portal' }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key-123' }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Download hand-tracking model (MediaPipe)
        run: |
          curl -fsSL --retry 3 -o android/app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -l android/app/src/main/assets/

      - name: Signing key
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KEYSTORE_PATH"
            echo "Using the permanent key from repository secrets."
          else
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Portal RPS, O=Portal RPS, C=IL"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this APK is signed with a temporary key. To update the installed app you will have to uninstall it first. See README."
          fi

      - name: Build APK
        working-directory: android
        run: |
          # Maven Central sometimes answers 429 (rate limit) on shared runners: retry with a pause
          set -o pipefail
          for i in 1 2 3; do
            gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log && exit 0
            grep -q "status code 429" /tmp/gradle.log || exit 1   # real build error: stop
            echo "Rate-limited (attempt $i), retrying in 45s..."; sleep 45
          done
          exit 1

      - name: Collect APK
        id: out
        run: |
          NAME="PortalRPS-v3.0.${VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          cp "$NAME" PortalRPS.apk   # fixed name: .../releases/latest/download/PortalRPS.apk always works
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "## APK: $NAME ($(du -h "$NAME" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.out.outputs.apk }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: פורטל אבן נייר v3.0.${{ github.run_number }}
          body: |
            אפליקציית אנדרואיד נייטיב (ARCore + זיהוי יד במכשיר).
            להתקנה: מורידים את קובץ ה-APK בטלפון ופותחים אותו.
            צריך טלפון שתומך ב-ARCore. בפעם הראשונה הטלפון אולי יבקש להתקין את Google Play Services for AR.
          files: |
            ${{ steps.out.outputs.apk }}
            PortalRPS.apk
          make_latest: true
